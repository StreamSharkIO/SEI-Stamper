name: Build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  OBS_VERSION: "32.0.0"
  OBS_DEPS_VERSION: "2026-05-21"
  QT_VERSION: "6.8.3"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and SIMDE
        run: |
          pip3 install --break-system-packages aqtinstall==3.3.0
          python3 -m aqt install-qt mac desktop ${{ env.QT_VERSION }} clang_64 --outputdir ${{ github.workspace }}/Qt
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV
          brew install simde

      - name: Download OBS source
        run: |
          curl -sL "https://github.com/obsproject/obs-studio/archive/refs/tags/${{ env.OBS_VERSION }}.tar.gz" -o obs-source.tar.gz
          tar xzf obs-source.tar.gz

      - name: Generate obsconfig.h
        run: |
          cat > obs-studio-${{ env.OBS_VERSION }}/libobs/obsconfig.h << 'EOF'
          #pragma once
          #define OBS_DATA_PATH ""
          #define OBS_PLUGIN_PATH ""
          #define OBS_PLUGIN_DESTINATION ""
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          EOF

      - name: Download OBS.app
        run: |
          curl -sL "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/obs-studio-${{ env.OBS_VERSION }}-macos-apple.dmg" -o obs.dmg
          hdiutil attach obs.dmg -nobrowse -mountpoint /tmp/obs-mount
          cp -R "/tmp/obs-mount/OBS.app" ./OBS.app
          hdiutil detach /tmp/obs-mount

      - name: Download OBS deps
        run: |
          curl -sL "https://github.com/obsproject/obs-deps/releases/download/${{ env.OBS_DEPS_VERSION }}/macos-deps-${{ env.OBS_DEPS_VERSION }}-universal.tar.xz" -o obs-deps.tar.xz
          mkdir -p obs-studio-${{ env.OBS_VERSION }}/.deps
          tar xJf obs-deps.tar.xz -C obs-studio-${{ env.OBS_VERSION }}/.deps/

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/macos" \
            -DOBS_SOURCE_DIR="${{ github.workspace }}/obs-studio-${{ env.OBS_VERSION }}" \
            -DOBS_APP_DIR="${{ github.workspace }}/OBS.app" \
            -DPLUGIN_VERSION="${GITHUB_REF_NAME#v}"

      - name: Build
        run: cmake --build build --config Release

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import cert.p12 -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "build" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12

      - name: Sign plugin
        run: |
          codesign --force --deep --sign "Developer ID Application: MetaCDN Pty Ltd (${{ secrets.APPLE_TEAM_ID }})" \
            --options runtime \
            build/plugin/sei-stamper.plugin

      - name: Notarize plugin
        run: |
          ditto -c -k --keepParent build/plugin/sei-stamper.plugin plugin.zip
          xcrun notarytool submit plugin.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple build/plugin/sei-stamper.plugin

      - name: Stage package
        run: |
          mkdir -p build/package
          cp -R build/plugin/sei-stamper.plugin build/package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sei-stamper-macos
          path: build/package/
